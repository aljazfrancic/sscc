# Builds the program and runs the tests on every push to main and on every
# pull request, with GCC and Clang on Linux and MSVC on Windows. Each compiler
# builds Release, which users run and in which the optimizer finds more
# warnings, and Debug, which keeps the asserts and, with MSVC, the bounds
# checks of the standard library. Warnings are errors, so any warning fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Finish the other jobs after a failure, so every combination reports.
      fail-fast: false
      matrix:
        compiler: [GCC, Clang, MSVC]
        build-type: [Debug, Release]
        # Each entry adds the runner and the CMake arguments of one compiler
        # to both of its build types.
        include:
          - compiler: GCC
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=g++
          - compiler: Clang
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=clang++
          - compiler: MSVC
            os: windows-latest
            cmake-args: ""  # The default Visual Studio generator uses MSVC.
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.cmake-args }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      # The Visual Studio generator builds several configurations, so the
      # build and the tests name the one they use.
      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel
      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build-type }} --output-on-failure
